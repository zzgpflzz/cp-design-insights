<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LINE FRIENDS SQUARE - Funding</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, sans-serif;
            background: #fff;
        }

        /* GNB Header */
        .gnb-header {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            height: 66px;
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(5px);
            -webkit-backdrop-filter: blur(5px);
            border-bottom: 1px solid #f3f3f3;
            z-index: 1000;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 370px;
        }

        .gnb-logo {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .gnb-logo-svg {
            height: 22px;
            width: auto;
            cursor: pointer;
        }

        .gnb-nav {
            display: flex;
            align-items: center;
            gap: 32px;
        }

        .gnb-nav a {
            font-size: 13px;
            color: #111;
            text-decoration: none;
            font-weight: 400;
            transition: color 0.3s;
        }

        .gnb-nav a:hover {
            color: #666;
        }

        .gnb-nav a.active {
            color: #f83baa;
            font-weight: 700;
        }

        .gnb-nav .lang-selector {
            display: flex;
            align-items: center;
            gap: 4px;
            font-size: 13px;
            font-weight: 500;
            color: #a0a0a0;
            cursor: pointer;
        }

        .gnb-nav .lang-selector::after {
            content: '▲';
            font-size: 8px;
            transform: rotate(180deg);
            display: inline-block;
        }

        .content-wrapper {
            margin-top: 66px;
        }

        .page-image {
            width: 100%;
            display: block;
            image-rendering: auto;
        }

        /* Toggle Buttons */
        .toggle-wrapper {
            position: fixed;
            top: 80px;
            right: 30px;
            display: flex;
            gap: 10px;
            z-index: 999;
        }

        .toggle-btn {
            padding: 12px 24px;
            background: rgba(0, 0, 0, 0.8);
            color: #fff;
            border: 2px solid #fff;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
        }

        .toggle-btn:hover {
            background: rgba(0, 0, 0, 1);
            transform: translateY(-2px);
        }

        .toggle-btn.active {
            background: #f83baa;
            border-color: #f83baa;
        }

        .section {
            width: 100%;
        }

        .section.hidden {
            display: none;
        }

        /* Thumbnail Button */
        .thumbnail-btn {
            position: fixed;
            top: 80px;
            left: 30px;
            padding: 12px 24px;
            background: rgba(0, 0, 0, 0.8);
            color: #fff;
            border: 2px solid #fff;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            z-index: 999;
            transition: all 0.3s;
        }

        .thumbnail-btn:hover {
            background: rgba(0, 0, 0, 1);
            transform: translateY(-2px);
        }

        /* Modal/Popup */
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.9);
            z-index: 9999;
            align-items: center;
            justify-content: center;
        }

        .modal.show {
            display: flex;
        }

        .modal-content {
            position: relative;
            max-width: 90%;
            max-height: 90%;
        }

        .modal-content img {
            width: 100%;
            height: auto;
            display: block;
        }

        .modal-close {
            position: absolute;
            top: -50px;
            right: 0;
            background: #fff;
            color: #000;
            border: none;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            font-size: 24px;
            cursor: pointer;
            font-weight: bold;
            transition: all 0.3s;
        }

        .modal-close:hover {
            background: #f83baa;
            color: #fff;
        }

        @media (max-width: 1400px) {
            .gnb-header {
                padding: 0 60px;
            }
        }

        @media (max-width: 768px) {
            .gnb-header {
                padding: 0 20px;
            }

            .gnb-nav {
                display: none;
            }
        }
    </style>
</head>
<body>
    <!-- GNB Header -->
    <header class="gnb-header">
        <div class="gnb-logo">
            <img src="../page2/gnb_logo.svg" alt="LINE FRIENDS SQUARE" class="gnb-logo-svg" onclick="location.href='../page2/template.html'">
        </div>
        <nav class="gnb-nav">
            <a href="../page2/template.html">About</a>
            <a href="../page2/store.html">Store</a>
            <a href="../page2/media.html">Media</a>
            <a href="../page2/contact.html">Contact Us</a>
            <a href="#">Shop</a>
            <span class="lang-selector">KR</span>
        </nav>
    </header>

    <!-- Thumbnail Button -->
    <button class="thumbnail-btn" onclick="openThumbnail()">📷 Thumbnail</button>

    <!-- Toggle Buttons -->
    <div class="toggle-wrapper">
        <button class="toggle-btn active" onclick="showTypeA()">A Type</button>
        <button class="toggle-btn" onclick="showType100()">100% Type</button>
    </div>

    <!-- Thumbnail Modal -->
    <div class="modal" id="thumbnailModal" onclick="closeThumbnail()">
        <div class="modal-content" onclick="event.stopPropagation()">
            <button class="modal-close" onclick="closeThumbnail()">×</button>
            <img src="Thumbnail_A_Type.jpg" alt="Thumbnail A Type">
        </div>
    </div>

    <!-- Content -->
    <div class="content-wrapper">
        <!-- A Type Section -->
        <section class="section" id="section-a">
            <img src="PC_PDP_FUNDING_-_A_Type.jpg" alt="Funding A Type" class="page-image">
        </section>

        <!-- 100% Type Section -->
        <section class="section hidden" id="section-100">
            <img src="PC_PDP_FUNDING_100_A_Type.jpg" alt="Funding 100% Type" class="page-image">
        </section>
    </div>

    <script>
        function showTypeA() {
            const btnA = document.querySelector('.toggle-btn:nth-child(1)');
            const btn100 = document.querySelector('.toggle-btn:nth-child(2)');
            const sectionA = document.getElementById('section-a');
            const section100 = document.getElementById('section-100');

            btnA.classList.add('active');
            btn100.classList.remove('active');
            sectionA.classList.remove('hidden');
            section100.classList.add('hidden');
        }

        function showType100() {
            const btnA = document.querySelector('.toggle-btn:nth-child(1)');
            const btn100 = document.querySelector('.toggle-btn:nth-child(2)');
            const sectionA = document.getElementById('section-a');
            const section100 = document.getElementById('section-100');

            btnA.classList.remove('active');
            btn100.classList.add('active');
            sectionA.classList.add('hidden');
            section100.classList.remove('hidden');
        }

        function openThumbnail() {
            const modal = document.getElementById('thumbnailModal');
            modal.classList.add('show');
        }

        function closeThumbnail() {
            const modal = document.getElementById('thumbnailModal');
            modal.classList.remove('show');
        }

        // ESC 키로 팝업 닫기
        document.addEventListener('keydown', function(e) {
            if (e.key === 'Escape') {
                closeThumbnail();
            }
        });
    </script>
</body>
</html>

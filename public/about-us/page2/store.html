<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LINE FRIENDS SQUARE - Store</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, sans-serif;
            background: #fff;
        }

        /* GNB Header */
        .gnb-header {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            height: 66px;
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(5px);
            -webkit-backdrop-filter: blur(5px);
            border-bottom: 1px solid #f3f3f3;
            z-index: 1000;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 370px;
        }

        .gnb-logo {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .gnb-logo-svg {
            height: 22px;
            width: auto;
            cursor: pointer;
        }

        .gnb-nav {
            display: flex;
            align-items: center;
            gap: 32px;
        }

        .gnb-nav a {
            font-size: 13px;
            color: #111;
            text-decoration: none;
            font-weight: 400;
            transition: color 0.3s;
        }

        .gnb-nav a:hover {
            color: #666;
        }

        .gnb-nav a.active {
            color: #f83baa;
            font-weight: 700;
        }

        .gnb-nav .lang-selector {
            display: flex;
            align-items: center;
            gap: 4px;
            font-size: 13px;
            font-weight: 500;
            color: #a0a0a0;
            cursor: pointer;
        }

        .gnb-nav .lang-selector::after {
            content: '▲';
            font-size: 8px;
            transform: rotate(180deg);
            display: inline-block;
        }

        .content-wrapper {
            margin-top: 66px;
        }

        .page-image {
            width: 100%;
            display: block;
            image-rendering: auto;
        }

        .clickable-wrapper {
            position: relative;
        }

        .click-area {
            position: absolute;
            cursor: pointer;
        }

        /* MYEONGDONG 영역 (왼쪽 상단 이미지) */
        .myeongdong-area {
            top: 10.5%;
            left: 5.8%;
            width: 44%;
            height: 23%;
        }

        /* HONGDAE 영역 (오른쪽 상단 이미지) */
        .hongdae-area {
            top: 10.5%;
            right: 5.8%;
            width: 44%;
            height: 23%;
        }

        @media (max-width: 1400px) {
            .gnb-header {
                padding: 0 60px;
            }
        }

        @media (max-width: 768px) {
            .gnb-header {
                padding: 0 20px;
            }

            .gnb-nav {
                display: none;
            }
        }
    </style>
</head>
<body>
    <!-- GNB Header -->
    <header class="gnb-header">
        <div class="gnb-logo">
            <img src="gnb_logo.svg" alt="LINE FRIENDS SQUARE" class="gnb-logo-svg" onclick="location.href='template.html'">
        </div>
        <nav class="gnb-nav">
            <a href="template.html">About</a>
            <a href="store.html" class="active">Store</a>
            <a href="media.html">Media</a>
            <a href="contact.html">Contact Us</a>
            <a href="#">Shop</a>
            <span class="lang-selector">KR</span>
        </nav>
    </header>

    <!-- Content -->
    <div class="content-wrapper">
        <div class="clickable-wrapper">
            <img src="main_template/sub/PC_about_us_Store-main.jpg" alt="Store Page" class="page-image">

            <!-- MYEONGDONG 클릭 영역 -->
            <div class="click-area myeongdong-area" onclick="location.href='store-md.html'" title="MYEONGDONG 상세보기"></div>

            <!-- HONGDAE 클릭 영역 (추후 필요시) -->
            <!-- <div class="click-area hongdae-area" onclick="location.href='store-hongdae.html'" title="HONGDAE 상세보기"></div> -->
        </div>
    </div>
</body>
</html>

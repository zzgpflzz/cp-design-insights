<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LINE FRIENDS SQUARE - About Us</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, sans-serif;
            background: #fff;
        }

        /* GNB Header */
        .gnb-header {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            height: 66px;
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(5px);
            -webkit-backdrop-filter: blur(5px);
            border-bottom: 1px solid #f3f3f3;
            z-index: 1000;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 370px;
        }

        .gnb-logo {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .gnb-logo-svg {
            height: 22px;
            width: auto;
            cursor: pointer;
        }

        .gnb-logo .about-badge {
            background: #000;
            color: #fff;
            padding: 5px 6px;
            font-size: 10px;
            font-weight: 700;
            letter-spacing: 0.5px;
            border-radius: 2px;
        }

        .gnb-nav {
            display: flex;
            align-items: center;
            gap: 32px;
        }

        .gnb-nav a {
            font-size: 13px;
            color: #111;
            text-decoration: none;
            font-weight: 400;
            transition: color 0.3s;
        }

        .gnb-nav a:hover {
            color: #666;
        }

        .gnb-nav a.active {
            color: #f83baa;
            font-weight: 700;
        }

        .gnb-nav .lang-selector {
            display: flex;
            align-items: center;
            gap: 4px;
            font-size: 13px;
            font-weight: 500;
            color: #a0a0a0;
            cursor: pointer;
        }

        .gnb-nav .lang-selector::after {
            content: '▲';
            font-size: 8px;
            transform: rotate(180deg);
            display: inline-block;
        }

        /* Content Sections */
        .content-wrapper {
            margin-top: 66px;
        }

        .template-section {
            width: 100%;
            display: block;
        }

        .template-section img {
            width: 100%;
            display: block;
            image-rendering: auto;
        }

        .template-section video {
            width: 100%;
            display: block;
        }

        /* Zoom Controls */
        .zoom-controls {
            position: fixed;
            bottom: 30px;
            right: 30px;
            display: flex;
            gap: 10px;
            z-index: 1000;
        }

        .zoom-btn {
            width: 50px;
            height: 50px;
            background: rgba(0, 0, 0, 0.8);
            color: #fff;
            border: none;
            border-radius: 50%;
            font-size: 24px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.3s;
        }

        .zoom-btn:hover {
            background: rgba(0, 0, 0, 1);
            transform: scale(1.1);
        }

        .zoom-info {
            position: fixed;
            bottom: 30px;
            left: 30px;
            background: rgba(0, 0, 0, 0.8);
            color: #fff;
            padding: 12px 20px;
            border-radius: 25px;
            font-size: 14px;
            font-weight: 600;
            z-index: 1000;
        }

        /* Media Section Toggle */
        .media-toggle-wrapper {
            position: relative;
        }

        .media-toggle-buttons {
            position: absolute;
            top: 20px;
            right: 20px;
            display: flex;
            gap: 10px;
            z-index: 10;
        }

        .media-toggle-btn {
            padding: 10px 20px;
            background: rgba(0, 0, 0, 0.8);
            color: #fff;
            border: 2px solid #fff;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
        }

        .media-toggle-btn:hover {
            background: rgba(0, 0, 0, 1);
            transform: translateY(-2px);
        }

        .media-toggle-btn.active {
            background: #f83baa;
            border-color: #f83baa;
        }

        .template-section.hidden {
            display: none;
        }

        @media (max-width: 1400px) {
            .gnb-header {
                padding: 0 60px;
            }
        }

        @media (max-width: 768px) {
            .gnb-header {
                padding: 0 20px;
            }

            .gnb-nav {
                display: none;
            }
        }
    </style>
</head>
<body>
    <!-- GNB Header -->
    <header class="gnb-header">
        <div class="gnb-logo">
            <img src="gnb_logo.svg" alt="LINE FRIENDS SQUARE" class="gnb-logo-svg" onclick="location.href='template.html'">
        </div>
        <nav class="gnb-nav">
            <a href="template.html" class="active">About</a>
            <a href="store.html">Store</a>
            <a href="media.html">Media</a>
            <a href="contact.html">Contact Us</a>
            <a href="#">Shop</a>
            <span class="lang-selector">KR</span>
        </nav>
    </header>

    <!-- Content Sections -->
    <div class="content-wrapper">
        <!-- Section 01: Hero Image -->
        <section class="template-section" id="section-01">
            <img src="main_template/main_01.jpg" alt="Hero Section">
        </section>

        <!-- Section 02: Hero Image -->
        <section class="template-section" id="section-02">
            <img src="main_template/main_02.jpg" alt="Hero Section">
        </section>

        <!-- Section 03: Vision -->
        <section class="template-section" id="section-03">
            <img src="main_template/main_03.jpg" alt="Vision Section">
        </section>

        <!-- Section 04: Recent Projects -->
        <section class="template-section" id="section-04">
            <img src="main_template/main_04.jpg" alt="Recent Projects Section">
        </section>

        <!-- Section 05: Store -->
        <section class="template-section" id="section-05">
            <img src="main_template/main_05.jpg" alt="Store Section">
        </section>

        <!-- Section 06: IP Portfolio with Toggle -->
        <div class="media-toggle-wrapper">
            <div class="media-toggle-buttons">
                <button class="media-toggle-btn active" onclick="showIP_A()">옵션 A</button>
                <button class="media-toggle-btn" onclick="showIP_B()">옵션 B</button>
            </div>

            <!-- Section 06-A: IP Portfolio A -->
            <section class="template-section" id="section-06a">
                <img src="main_template/main_06.jpg" alt="IP Portfolio Section A">
            </section>

            <!-- Section 06-B: IP Portfolio B (hidden by default) -->
            <section class="template-section hidden" id="section-06b">
                <img src="main_template/main_06-B.jpg" alt="IP Portfolio Section B">
            </section>
        </div>

        <!-- Section 07: Media with Toggle -->
        <div class="media-toggle-wrapper">
            <div class="media-toggle-buttons">
                <button class="media-toggle-btn active" onclick="showMediaA()">옵션 A</button>
                <button class="media-toggle-btn" onclick="showMediaB()">옵션 B</button>
            </div>

            <!-- Section 07-A: Media Part A -->
            <section class="template-section" id="section-07a">
                <img src="main_template/main_07-A.jpg" alt="Media Section A">
            </section>

            <!-- Section 07-B: Media Part B (hidden by default) -->
            <section class="template-section hidden" id="section-07b">
                <img src="main_template/main_07-B.jpg" alt="Media Section B">
            </section>
        </div>

        <!-- Section 08: Contact Us -->
        <section class="template-section" id="section-08">
            <img src="main_template/main_08.jpg" alt="Contact Section">
        </section>

        <!-- Section 09: Footer -->
        <section class="template-section" id="section-09">
            <img src="main_template/main_09.jpg" alt="Footer Section">
        </section>
    </div>

    <!-- Zoom Info -->
    <div class="zoom-info" id="zoomInfo">확대: 100%</div>

    <!-- Zoom Controls -->
    <div class="zoom-controls">
        <button class="zoom-btn" onclick="zoomOut()" title="축소">−</button>
        <button class="zoom-btn" onclick="zoomIn()" title="확대">+</button>
        <button class="zoom-btn" onclick="resetZoom()" title="100%">⊙</button>
    </div>

    <script>
        let currentZoom = 100;
        const wrapper = document.querySelector('.content-wrapper');
        const zoomInfo = document.getElementById('zoomInfo');

        function updateZoom() {
            wrapper.style.transform = `scale(${currentZoom / 100})`;
            wrapper.style.transformOrigin = 'top center';
            zoomInfo.textContent = '확대: ' + currentZoom + '%';
        }

        function zoomIn() {
            if (currentZoom < 200) {
                currentZoom += 25;
                updateZoom();
            }
        }

        function zoomOut() {
            if (currentZoom > 50) {
                currentZoom -= 25;
                updateZoom();
            }
        }

        function resetZoom() {
            currentZoom = 100;
            updateZoom();
        }

        // 키보드 단축키
        document.addEventListener('keydown', function(e) {
            if (e.key === '+' || e.key === '=') {
                zoomIn();
            } else if (e.key === '-') {
                zoomOut();
            } else if (e.key === '0') {
                resetZoom();
            }
        });

        // IP Portfolio Toggle (Section 06)
        function showIP_A() {
            const wrapper = document.querySelector('#section-06a').parentElement;
            const btnA = wrapper.querySelector('.media-toggle-btn:nth-child(1)');
            const btnB = wrapper.querySelector('.media-toggle-btn:nth-child(2)');
            const sectionA = document.getElementById('section-06a');
            const sectionB = document.getElementById('section-06b');

            btnA.classList.add('active');
            btnB.classList.remove('active');
            sectionA.classList.remove('hidden');
            sectionB.classList.add('hidden');
        }

        function showIP_B() {
            const wrapper = document.querySelector('#section-06a').parentElement;
            const btnA = wrapper.querySelector('.media-toggle-btn:nth-child(1)');
            const btnB = wrapper.querySelector('.media-toggle-btn:nth-child(2)');
            const sectionA = document.getElementById('section-06a');
            const sectionB = document.getElementById('section-06b');

            btnA.classList.remove('active');
            btnB.classList.add('active');
            sectionA.classList.add('hidden');
            sectionB.classList.remove('hidden');
        }

        // Media Section Toggle (Section 07)
        function showMediaA() {
            const wrapper = document.querySelector('#section-07a').parentElement;
            const btnA = wrapper.querySelector('.media-toggle-btn:nth-child(1)');
            const btnB = wrapper.querySelector('.media-toggle-btn:nth-child(2)');
            const sectionA = document.getElementById('section-07a');
            const sectionB = document.getElementById('section-07b');

            btnA.classList.add('active');
            btnB.classList.remove('active');
            sectionA.classList.remove('hidden');
            sectionB.classList.add('hidden');
        }

        function showMediaB() {
            const wrapper = document.querySelector('#section-07a').parentElement;
            const btnA = wrapper.querySelector('.media-toggle-btn:nth-child(1)');
            const btnB = wrapper.querySelector('.media-toggle-btn:nth-child(2)');
            const sectionA = document.getElementById('section-07a');
            const sectionB = document.getElementById('section-07b');

            btnA.classList.remove('active');
            btnB.classList.add('active');
            sectionA.classList.add('hidden');
            sectionB.classList.remove('hidden');
        }
    </script>
</body>
</html>

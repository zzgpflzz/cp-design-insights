<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LINE FRIENDS SQUARE - MYEONGDONG Store</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, sans-serif;
            background: #fff;
        }

        /* GNB Header */
        .gnb-header {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            height: 66px;
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(5px);
            -webkit-backdrop-filter: blur(5px);
            border-bottom: 1px solid #f3f3f3;
            z-index: 1000;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 370px;
        }

        .gnb-logo {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .gnb-logo-svg {
            height: 22px;
            width: auto;
            cursor: pointer;
        }

        .gnb-nav {
            display: flex;
            align-items: center;
            gap: 32px;
        }

        .gnb-nav a {
            font-size: 13px;
            color: #111;
            text-decoration: none;
            font-weight: 400;
            transition: color 0.3s;
        }

        .gnb-nav a:hover {
            color: #666;
        }

        .gnb-nav a.active {
            color: #f83baa;
            font-weight: 700;
        }

        .gnb-nav .lang-selector {
            display: flex;
            align-items: center;
            gap: 4px;
            font-size: 13px;
            font-weight: 500;
            color: #a0a0a0;
            cursor: pointer;
        }

        .gnb-nav .lang-selector::after {
            content: '▲';
            font-size: 8px;
            transform: rotate(180deg);
            display: inline-block;
        }

        .content-wrapper {
            margin-top: 66px;
        }

        .page-image {
            width: 100%;
            display: block;
            image-rendering: auto;
        }

        .back-button {
            position: fixed;
            top: 80px;
            left: 30px;
            padding: 12px 24px;
            background: rgba(0, 0, 0, 0.8);
            color: #fff;
            border: none;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            z-index: 999;
            transition: all 0.3s;
        }

        .back-button:hover {
            background: rgba(0, 0, 0, 1);
            transform: translateY(-2px);
        }

        @media (max-width: 1400px) {
            .gnb-header {
                padding: 0 60px;
            }
        }

        @media (max-width: 768px) {
            .gnb-header {
                padding: 0 20px;
            }

            .gnb-nav {
                display: none;
            }
        }
    </style>
</head>
<body>
    <!-- GNB Header -->
    <header class="gnb-header">
        <div class="gnb-logo">
            <img src="gnb_logo.svg" alt="LINE FRIENDS SQUARE" class="gnb-logo-svg" onclick="location.href='template.html'">
        </div>
        <nav class="gnb-nav">
            <a href="template.html">About</a>
            <a href="store.html" class="active">Store</a>
            <a href="media.html">Media</a>
            <a href="contact.html">Contact Us</a>
            <a href="#">Shop</a>
            <span class="lang-selector">KR</span>
        </nav>
    </header>

    <!-- Back Button -->
    <button class="back-button" onclick="history.back()">← 뒤로가기</button>

    <!-- Content -->
    <div class="content-wrapper">
        <img src="main_template/sub/PC_about_us_Store-md.jpg" alt="MYEONGDONG Store Detail" class="page-image">
    </div>
</body>
</html>
